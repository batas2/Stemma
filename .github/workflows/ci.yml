name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Stemma.slnx
      - name: Build
        run: dotnet build Stemma.slnx --no-restore -c Release
      - name: Test
        run: dotnet test Stemma.slnx --no-build -c Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend (Vite + React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Stemma.Web.Client
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/Stemma.Web.Client/package-lock.json
      - name: Install
        run: npm ci --no-fund --no-audit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
