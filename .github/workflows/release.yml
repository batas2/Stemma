name: Release

# A release is two steps, and the second is a person's.
#
# 1. Pushing a tag `vX.Y.Z` builds, tests and packages that commit, tries what it built the way a
#    user will, and leaves a *draft* release with the tarball, the tool packages and their checksums
#    attached. Nothing public has happened: a draft can be read, fixed or deleted.
# 2. Publishing that draft on GitHub pushes the tool packages to nuget.org, which cannot be taken
#    back, only unlisted. It is skipped while the repository has no NUGET_API_KEY secret.
#
# Run by hand (workflow_dispatch), it is a rehearsal: everything step 1 does except the release,
# with what it built attached to the run instead.
#
# The procedure, and what to check before each step: .doc/engineering/releasing.md.

on:
  push:
    tags: ['v*.*.*']
  release:
    types: [published]
  workflow_dispatch:

jobs:
  draft:
    name: Build, try and draft
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/Stemma.Web.Client/package-lock.json

      # Directory.Build.props is the one place the version is written down. A tag that says
      # otherwise would publish binaries that disagree with their own release.
      - name: The tag is the version
        run: |
          version="$(dotnet msbuild src/Stemma.Cli/Stemma.Cli.csproj -getProperty:Version -nologo)"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but Directory.Build.props says $version."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Release notes
        run: scripts/release/notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"

      # The front end first, so the render tests have a page to render rather than skipping.
      - name: Front end
        working-directory: src/Stemma.Web.Client
        run: |
          npm ci --no-fund --no-audit
          npm test
          npm run build

      # Built whole before anything is tested: `dotnet test` on a solution runs each test project as
      # soon as that project is built, and the render tests need the host, which none of them
      # references. They skip rather than fail without it, so a skip is checked for here.
      - name: Backend
        run: |
          set -o pipefail
          dotnet build Stemma.slnx -c Release
          dotnet test Stemma.slnx -c Release --no-build --logger "console;verbosity=normal" | tee "$RUNNER_TEMP/backend.log"
          if grep -q 'Skipped Stemma.Cli.Tests.RenderContractTests' "$RUNNER_TEMP/backend.log"; then
            echo "::error::The render tests were skipped, so nothing checked what a render draws."
            exit 1
          fi

      - name: Package
        run: |
          scripts/package/package-linux.sh --out dist
          dotnet pack src/Stemma.Cli -c Release -o dist/tool --nologo

      - name: Try the tarball, with no .NET
        run: scripts/package/smoke-test.sh dist/stemma-linux-x64.tar.gz --version "$VERSION"

      - name: Try the tool, installed from its package
        run: scripts/package/smoke-test.sh --tool dist/tool --version "$VERSION"

      - name: Checksums
        working-directory: dist
        run: |
          cp tool/*.nupkg .
          sha256sum stemma-linux-x64.tar.gz *.nupkg > SHA256SUMS
          cat SHA256SUMS

      - name: Keep what a rehearsal built
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: stemma-${{ env.VERSION }}
          path: |
            dist/stemma-linux-x64.tar.gz
            dist/*.nupkg
            dist/SHA256SUMS
          retention-days: 7

      - name: Draft the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Stemma $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            dist/stemma-linux-x64.tar.gz dist/*.nupkg dist/SHA256SUMS

  nuget:
    name: Publish the tool to nuget.org
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Asked here rather than handed to every step: the key reaches the one command that uses it.
      - name: Is there a key
        id: key
        run: echo "present=${{ secrets.NUGET_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: The packages the release was drafted with
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.nupkg' --pattern SHA256SUMS --dir packages
          cd packages && sha256sum --check --ignore-missing SHA256SUMS

      - name: Push
        if: steps.key.outputs.present == 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The platform package first: the pointer package names it, and installing the pointer
          # before its target exists would fail for anyone quick enough to try.
          for package in "Stemma.linux-x64.$version.nupkg" "Stemma.$version.nupkg"; do
            dotnet nuget push "packages/$package" --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: No key
        if: steps.key.outputs.present != 'true'
        run: echo "::notice::No NUGET_API_KEY secret, so nothing was pushed to nuget.org. The packages are attached to the release."
